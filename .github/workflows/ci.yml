# Continuous integration for numerical-core.
#
# Three jobs:
#   * test — tests on the matrix "operating system × BLAS/LAPACK implementation".
#     The implementation is selected by the `numerics.backend` property (java — the pure-JVM
#     netlib F2J implementation, native — system BLAS/LAPACK via JNI). On Ubuntu the system
#     libraries are not preinstalled, so the native variant installs
#     libopenblas-dev: it provides libblas.so.3 and liblapack.so.3 via alternatives.
#     Without them netlib silently falls back to F2J — this is caught by the test
#     BackendSpiTest.defaultMatchesRequestedProperty, which compares `isNative` of the
#     default implementation with the requested property value.
#   * publish-check — publication to the local Maven repository and a check of the
#     artifact contents and its POM.
#   * publish — publication of both artifacts to GitHub Packages. Runs only
#     when a vX.Y.Z tag is pushed and after the two previous jobs succeed.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# A new run on the same branch cancels the previous unfinished one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [java, native]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      # On macOS the system BLAS/LAPACK is provided by Accelerate; nothing needs to be installed.
      - name: Install system BLAS/LAPACK (Ubuntu, native)
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'native'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Tests on the ${{ matrix.backend }} implementation
        run: ./gradlew :numerical-core:test :numerical-core-openblas:test -Dnumerics.backend=${{ matrix.backend }} --no-daemon
        env:
          # Limit the threads of the system OpenBLAS (as in the openblas module): multithreaded
          # dgetrf on the default thread stack crashed the test JVM (exit 139).
          OPENBLAS_NUM_THREADS: 4

      # The coverage report and its bar are taken once, on the most reproducible
      # matrix variant (Ubuntu, pure-JVM implementation).
      - name: Coverage (Kover) and its bar
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'java'
        run: ./gradlew :numerical-core:koverXmlReport :numerical-core:koverVerify -Dnumerics.backend=java --no-daemon

      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            core/build/reports/kover/report.xml
            core/build/test-results/
            openblas/build/test-results/
            **/hs_err_pid*.log
          if-no-files-found: ignore

  publish-check:
    name: Artifact publication check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to the local Maven repository
        run: ./gradlew publishToMavenLocal --no-daemon

      # Coordinates and version are read from gradle.properties so that the check does not
      # diverge from the build when the version changes.
      - name: Check artifact contents and POM
        run: |
          set -eu
          group=$(grep '^group=' gradle.properties | cut -d= -f2 | tr . /)
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          dir="$HOME/.m2/repository/$group/numerical-core/$version"
          ls -la "$dir"
          for f in "numerical-core-$version.jar" "numerical-core-$version-sources.jar" "numerical-core-$version.pom"; do
            test -s "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
          done
          pom="$dir/numerical-core-$version.pom"
          # The netlib dependency must be declared: without it a program that depends on
          # the library gets no BLAS/LAPACK at runtime.
          grep -q 'dev.ludovic.netlib' "$pom" || { echo "POM does not declare the dev.ludovic.netlib dependency"; exit 1; }
          # netlib is the only implementation: no other dependency groups may appear in the POM.
          groupId=$(grep '^group=' gradle.properties | cut -d= -f2)
          unexpected=$(grep -o '<groupId>[^<]*</groupId>' "$pom" | sort -u \
            | grep -v -e "$groupId" -e 'dev.ludovic.netlib' -e 'org.jetbrains.kotlin' || true)
          if [ -n "$unexpected" ]; then
            echo "POM declares unexpected dependencies: $unexpected"; exit 1
          fi
          echo "artifact $group:numerical-core:$version published correctly"
          # Second artifact: bundled OpenBLAS. Must depend on numerical-core and on openblas-platform.
          dir2="$HOME/.m2/repository/$group/numerical-core-openblas/$version"
          ls -la "$dir2"
          for f in "numerical-core-openblas-$version.jar" "numerical-core-openblas-$version-sources.jar" "numerical-core-openblas-$version.pom"; do
            test -s "$dir2/$f" || { echo "missing $dir2/$f"; exit 1; }
          done
          pom2="$dir2/numerical-core-openblas-$version.pom"
          grep -q '<artifactId>numerical-core</artifactId>' "$pom2" || { echo "openblas POM does not declare the numerical-core dependency"; exit 1; }
          grep -q 'openblas-platform' "$pom2" || { echo "openblas POM does not declare the openblas-platform dependency"; exit 1; }
          echo "artifact $group:numerical-core-openblas:$version published correctly"

  publish:
    name: Publish to GitHub Packages
    # Only on a version tag: pushes to branches do not publish artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      # Credentials for GitHub Packages: the actor's name and the workflow's built-in token.
      - name: Publish both artifacts to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
