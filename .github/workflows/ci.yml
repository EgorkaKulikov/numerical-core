# Непрерывная интеграция библиотеки numerical-core.
#
# Два job'а, оба быстрые (единицы секунд на тесты, ~1 мин с прогревом Gradle):
#   test          — весь набор тестов на реализации по умолчанию (системная BLAS/LAPACK
#                   с откатом на Java) и на Java-реализации netlib, плюс отчёт Kover;
#   publish-check — локальная публикация артефакта и проверка, что jar, sources и
#                   POM действительно легли в ~/.m2: это единственный способ
#                   подключения библиотеки соседними репозиториями.
#
# Машинно-зависимых гейтов здесь НЕТ: все выходы библиотеки проверяются
# аналитическими тестами с допусками, не привязанными к архитектуре CPU.
# Характеризационные эталоны с допуском 1e-9 живут в integral-equations и
# гоняются там против опубликованного артефакта этой библиотеки.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Отменяем предыдущий прогон той же ветки: устаревший результат никому не нужен.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и покрытие
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      # Диагностика реализации — первым прогоном: `BackendSpiTest` показывает, какая
      # BLAS/LAPACK (системная или Java) загрузилась на раннере.
      - name: Диагностика активного бэкенда линейной алгебры
        run: ./gradlew test --tests 'numerics.backend.BackendSpiTest' --info

      - name: Тесты и покрытие (бэкенд по умолчанию)
        run: ./gradlew test koverXmlReport

      # Тот же набор на Java-реализации netlib: согласие реализаций — контракт
      # библиотеки, и он обязан выполняться на обоих путях.
      - name: Тесты на Java-реализации BLAS/LAPACK
        run: ./gradlew test -Dnumerics.backend=java --rerun

      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/reports/kover/**
          if-no-files-found: warn

  publish-check:
    name: Проверка публикации артефакта
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настройка Gradle с кэшем
        uses: gradle/actions/setup-gradle@v6

      - name: Публикация в локальный репозиторий Maven
        run: ./gradlew publishToMavenLocal

      # Координаты и версия читаются из gradle.properties, чтобы проверка не
      # расходилась со сборкой при смене версии.
      - name: Проверка наличия артефактов в ~/.m2
        run: |
          set -eu
          group=$(grep '^group=' gradle.properties | cut -d= -f2 | tr . /)
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          dir="$HOME/.m2/repository/$group/numerical-core/$version"
          ls -la "$dir"
          for f in "numerical-core-$version.jar" "numerical-core-$version-sources.jar" "numerical-core-$version.pom"; do
            test -s "$dir/$f" || { echo "отсутствует $dir/$f"; exit 1; }
          done
          # В POM не должно быть зависимостей на соседние библиотеки: направление
          # зависимостей — только от них к numerical-core.
          if grep -qE 'minimal-splines|integral-equations' "$dir/numerical-core-$version.pom"; then
            echo "POM содержит обратную зависимость"; exit 1
          fi
          echo "артефакт $group:numerical-core:$version опубликован корректно"
